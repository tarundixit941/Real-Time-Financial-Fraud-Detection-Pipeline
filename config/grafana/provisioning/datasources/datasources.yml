apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
    editable: false


  - name: Apache_Cassandra_Cluster
    type: hadara-cassandra-datasource
    access: proxy
    url: cassandra:9042
    jsonData:
      keyspace: fraud_detection
      consistency: ONE
      timeout: 30000
    secureJsonData:
      # Prevents plain text metadata leakage across configuration monitoring loops
      tlsSkipVerify: true
    editable: false
